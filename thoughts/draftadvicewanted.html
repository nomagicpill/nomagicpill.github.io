If you could write one essay to every scared new grad and young person in software… What would you tell them?

Prizes: $10,000 first place / $1,000 2nd, 3rd, 4th, and 5th

Deadline: December 31st, 2026 at 11:59 PM Pacific

It’s a bad time to be a young person in software. At least it is if you’ve been reading the news. And posts. And threads. And comments.

But is dooming the right response? Is every young person in software just cooked? Or is there something more useful we could be telling these people? We haven’t seen a truly great piece of writing aimed at addressing what has become a life-altering anxiety for millions of people. We would like to see one. (Or many.)

You’re writing to people with doubts like:

“What’s software engineering even going to look like in 20 years?”
“I’m scared. What should I do? Should I switch career paths?”
“Claude knows way more than me. What can I do to not become obsolete?”
You have 3,000 words. Imagine that whatever you write will be read by every single scared young software person in the world.

What do you write?
